name: Build JHS Laser WebUI Binaries
on:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build Windows x86 & Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -ldflags="-s -w" -o dist/JHS_Laser_WebUI_win_x86.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -ldflags="-s -w -H=windowsgui" -o dist/JHS_Laser_WebUI_Silent_win_x86.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/jhs-laser-webui-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: jhs-laser-webui-binaries
          path: dist/